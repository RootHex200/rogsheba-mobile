name: golden-fix

on:
  push:
    branches: [issue/6-home-screen-completion]

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate goldens on the CI platform
        run: flutter test --update-goldens test/goldens

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/goldens/*.png